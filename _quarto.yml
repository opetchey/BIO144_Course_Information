project:
  type: book
  output-dir: docs
  resources:
    - assets/Week1_lecture.html
    - assets/Week1_lecture_slides.pdf
    - assets/Week11_lecture.html
    - assets/Week11_lecture_slides.pdf

book:
  title: "BIO144 Course Information (version 2027, draft)"
  author: "Owen Petchey"
  date: today
  reader-mode: true

  page-footer:
    left: |
      BIO144 Data Analysis for Biologists, Course Information written by Owen Petchey
    right: |
      This website was built with <a href="https://quarto.org/">Quarto</a>.
  cover-image: cover.png
  favicon: assets/favicon.png
  site-url: https://opetchey.github.io/BIO144_Course_Information/
  repo-url: https://github.com/opetchey/BIO144_Course_Information/
  repo-branch: main
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - 1.1-general-information.qmd
    - 1.2-previous-knowledge.qmd
    - 2.1-year-specific-information.qmd
    - 3.1-learning-objectives.qmd
    - 4.1-faqs.qmd
    - 5.1-discussion-forum.qmd
    - Unit1.qmd
    - Unit2.qmd
    - Unit3.qmd
    - Unit4.qmd
    - Unit5.qmd
    - Unit6.qmd
    - Unit7.qmd
    - Unit8.qmd
    - Unit9.qmd
    - Unit10.qmd
    - Unit11.qmd
    - Unit12.qmd
    - 6.1-homework-practicals-quizzes.qmd
    
   

format:
  html:
    theme:
      light: [cosmo, style/bio144-light.scss, style/bio144-rules.scss]
      dark: [cosmo, style/bio144-dark.scss, style/bio144-rules.scss]
    include-after-body: style/bio144-units.html
    fig-width: 5
    fig-height: 5
    fig-align: center
  pdf:
    keep-tex: false
    documentclass: book
    classoption:
      - 8pt
      - a4paper
    toc-depth: 2

    
execute: 
  echo: false
  

