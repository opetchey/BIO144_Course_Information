unit: 12
title: "Review: planning and implementing statistical analyses"
book_chapter: "12.1-review.qmd"
course_info_page: "Unit12.qmd"
status: locked            # draft | reviewed | locked
version: "2027.0"
last_updated: "2026-10-06"
stem: "After this unit, students will be able to:"

objectives:
  - id: LO12.1.1
    text: "Write a planning sentence for a described study, stating the question, the type of response variable, the data structure, the explanatory variables, the planned model and the expected residual degrees of freedom."
    bloom: [apply]
    type: concept

  - id: LO12.1.2
    text: "Choose a model (linear model, binomial GLM, Poisson GLM, mixed model or ordination) from the type of response variable, the explanatory variables and the data structure of a described study."
    bloom: [evaluate]
    type: concept

  - id: LO12.1.3
    text: "Identify the experimental unit in a described study, and recognise pseudoreplication."
    bloom: [analyse]
    type: concept

  - id: LO12.1.4
    text: "Explain the roles of replication, randomisation, controls, blocking and balance in study design."
    bloom: [understand]
    type: concept

  - id: LO12.1.5
    text: "Count the parameters a planned model will estimate, calculate the expected residual degrees of freedom, and judge whether they are enough."
    bloom: [apply, evaluate]
    type: concept

  - id: LO12.1.6
    text: "Explain how sample size affects the precision of estimates and the power of a study, and what a power analysis is for."
    bloom: [understand]
    type: concept

  - id: LO12.1.7
    text: "Decide which terms to include in a model from the question and the design (variables of interest, planned interactions, design variables, potential confounders), and explain why trying many models or using stepwise selection gives misleading p-values."
    bloom: [evaluate, understand]
    type: concept

  - id: LO12.1.8
    text: "Check a fitted model before interpreting it, make explicit predictions from it, and plot the predictions together with the data."
    bloom: [apply]
    type: analysis

  - id: LO12.1.9
    text: "Recognise a report that gives both the statistical result and its biological meaning."
    bloom: [analyse]
    type: concept

