unit: 3
title: "Simple linear regression – Part 1"
book_chapter: "3.1-regression-part1.qmd"
course_info_page: "Unit3.qmd"
status: reviewed            # draft | reviewed | locked
version: "2027.0-draft"
last_updated: "2026-10-06"
stem: "After this unit, students will be able to:"

objectives:
  - id: LO3.1.1
    text: "Explain when simple linear regression is an appropriate tool for a biological question."
    bloom: [understand]
    type: concept

  - id: LO3.1.2
    text: "Write the simple linear regression model as an equation, and identify the intercept, slope and error term."
    bloom: [understand]
    type: concept

  - id: LO3.1.3
    text: "Explain the least squares principle by which the intercept and slope are estimated."
    bloom: [understand]
    type: concept

  - id: LO3.1.4
    text: "Calculate fitted values and residuals from a regression equation and data."
    bloom: [apply]
    type: concept

  - id: LO3.1.5
    text: "Explain what degrees of freedom are: the number of independent pieces of information left for estimating variation after the model parameters have been estimated, so that the residual degrees of freedom equal the number of observations minus the number of estimated parameters."
    bloom: [understand]
    type: concept
    review_note: "Partly addressed: 3.1 now has a short definition of residual degrees of freedom (new section). Check it is used consistently in later chapters (e.g. 5.1 explains via the mean)."

  - id: LO3.1.6
    text: "Explain why the residual variance of a simple linear regression is estimated by dividing the residual sum of squares by n − 2, and calculate the residual degrees of freedom."
    bloom: [understand, apply]
    type: concept

  - id: LO3.1.7
    text: "Explain why few residual degrees of freedom are a problem: imprecise estimates of the residual variance, larger critical t-values and so wider confidence intervals and less power, a risk of fitting noise, and difficulty checking assumptions."
    bloom: [understand]
    type: concept
    review_note: "New content added to 3.1 (section 'Degrees of freedom, and why having few of them is a problem')."

  - id: LO3.1.8
    text: "Describe how the error term is modelled: normally distributed, with mean zero and constant variance."
    bloom: [understand]
    type: concept

  - id: LO3.1.9
    text: "State the assumptions of simple linear regression."
    bloom: [remember]
    type: concept

  - id: LO3.1.10
    text: "Use R to fit a simple linear regression with `lm()` and obtain the estimated intercept and slope."
    bloom: [apply]
    type: analysis

  - id: LO3.1.11
    text: "Use diagnostic plots to judge whether the assumptions of a linear regression are reasonably met, and identify which assumption is violated if not."
    bloom: [analyse, evaluate]
    type: analysis

  - id: LO3.1.12
    text: "Explain leverage and Cook's distance, and identify influential observations."
    bloom: [understand, analyse]
    type: analysis
    review_note: "Added in full review (covered in book): check wording and examinability."

  - id: LO3.1.13
    text: "Identify common problems in a regression (e.g. non-linearity, non-constant variance, influential observations) and select an appropriate remedy (e.g. a transformation)."
    bloom: [analyse, evaluate]
    type: analysis
    review_note: "Book covers non-linearity, non-constant variance, outliers and transformations (log, square root). Check the list matches."

  - id: LO3.1.14
    text: "Interpret the coefficients of a regression with a log-transformed response and/or explanatory variable (e.g. as proportional or multiplicative effects)."
    bloom: [analyse]
    type: analysis
    review_note: "Gap addressed 2027: new 3.1 section 'Interpreting a model with log-transformed variables'."

  - id: LO3.1.15
    text: "Explain what makes a model linear (linear in its parameters), so that models with transformed variables can still be fitted with `lm()`."
    bloom: [understand]
    type: concept
    review_note: "Added in full review (covered in book): check wording and examinability."

