unit: 8
title: "Generalised linear models for count data"
book_chapter: "8.1-GLM1-count-data.qmd"
course_info_page: "Unit8.qmd"
status: locked            # draft | reviewed | locked
version: "2027.0"
last_updated: "2026-10-06"
stem: "After this unit, students will be able to:"

objectives:
  - id: LO8.1.1
    text: "Identify biological questions and study designs in which the response variable is a count."
    bloom: [understand]
    type: concept

  - id: LO8.1.2
    text: "Explain why linear models with normal errors are often inappropriate for count data (counts are non-negative integers, and their variance tends to increase with the mean)."
    bloom: [understand]
    type: concept

  - id: LO8.1.3
    text: "Describe the three components of a generalised linear model: the linear predictor, the distribution family and the link function."
    bloom: [understand]
    type: concept

  - id: LO8.1.4
    text: "Use R to fit a Poisson regression with `glm()`."
    bloom: [apply]
    type: analysis

  - id: LO8.1.5
    text: "Explain null and residual deviance as measures of fit for a GLM, analogous to sums of squares in a linear model."
    bloom: [understand]
    type: concept

  - id: LO8.1.6
    text: "Check the assumptions of a Poisson GLM using diagnostic plots, recognising that QQ-plots of deviance residuals are interpreted differently from those of a linear model."
    bloom: [analyse, evaluate]
    type: analysis

  - id: LO8.1.7
    text: "Interpret coefficients on the log (link) scale, and back-transform them to multiplicative effects on the expected count."
    bloom: [analyse]
    type: analysis

  - id: LO8.1.8
    text: "Use R to calculate predicted counts for given values of the explanatory variables."
    bloom: [apply]
    type: analysis

  - id: LO8.1.9
    text: "Use deviance-based tests to judge whether explanatory variables are associated with the response."
    bloom: [apply, analyse]
    type: analysis

  - id: LO8.1.10
    text: "Explain that in a chi-squared (likelihood ratio) test between nested GLMs, the degrees of freedom equal the difference in the number of estimated parameters."
    bloom: [understand]
    type: concept

  - id: LO8.1.11
    text: "Detect overdispersion and select an appropriate response to it (e.g. a quasi-Poisson or negative binomial model)."
    bloom: [analyse, evaluate]
    type: analysis

  - id: LO8.1.12
    text: "Recognise zero inflation in count data, and that it requires models beyond the Poisson GLM."
    bloom: [understand]
    type: concept

  - id: LO8.1.13
    text: "Recognise a correct and complete statement of results from a Poisson regression."
    bloom: [analyse]
    type: concept

