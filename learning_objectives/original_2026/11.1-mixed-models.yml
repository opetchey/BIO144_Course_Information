unit: 11
title: "Mixed models"
book_chapter: "11.1-mixed-models.qmd"
course_info_page: "Unit11.qmd"
status: draft            # draft | reviewed | locked
version: "2026-original"
last_updated: "2026-10-06"
stem: "After this unit, students will be able to:"

objectives:
  - id: LO11.1.1
    text: "Recognise biological situations in which data are **grouped, nested, or hierarchical**."
    bloom: [understand]
    type: concept

  - id: LO11.1.2
    text: "Explain why standard linear models may be inappropriate for grouped data."
    bloom: [understand]
    type: concept

  - id: LO11.1.3
    text: "Describe the conceptual difference between **fixed effects** and **random effects**."
    bloom: [understand]
    type: concept

  - id: LO11.1.4
    text: "Understand random effects as a way of modelling **structured sources of variation**."
    bloom: [understand]
    type: concept
    review_note: "Vague verb; rewrite with an observable verb."

  - id: LO11.1.5
    text: "Interpret mixed models as extensions of linear models, rather than as fundamentally different tools."
    bloom: [understand]
    type: concept

  - id: LO11.1.6
    text: "Identify common biological examples where mixed models are appropriate (e.g. repeated measures, individuals within populations, sites within regions)."
    bloom: [understand]
    type: concept
    review_note: "Overlaps with first objective."

  - id: LO11.1.7
    text: "Interpret mixed model output at a conceptual level, focusing on biological meaning rather than technical detail."
    bloom: [analyse]
    type: analysis

  - id: LO11.1.8
    text: "Appreciate the role of **partial pooling** in balancing information across groups."
    bloom: [understand]
    type: concept
    review_note: "Vague verb; rewrite with an observable verb."

  - id: LO11.1.9
    text: "Recognise the limitations and assumptions of mixed models without needing to master implementation details."
    bloom: [understand]
    type: concept

  - id: LO11.1.10
    text: "Use R to fit simple linear mixed models using the `lme4` package."
    bloom: [apply]
    type: analysis

  - id: LO11.1.11
    text: "Communicate results from mixed model analyses effectively, focusing on biological interpretation."
    bloom: [create]
    type: concept
    review_note: "Producing written/visual communication is not assessed in the exam format; reword (e.g. recognise a correct statement) or mark as not examined."
