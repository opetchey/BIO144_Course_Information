objectives:
  - id: LO6.1.1
    text: "Understand what is a question that multiple regression can help answer."
    bloom: [understand]
    type: concept
    review_note: "Vague verb; rewrite with an observable verb."

  - id: LO6.1.2
    text: "Know the mathematical form of multiple regression models."
    bloom: [remember]
    type: concept
    review_note: "Vague verb; rewrite with an observable verb."

  - id: LO6.1.3
    text: "Fit linear models with multiple explanatory variables."
    bloom: [apply]
    type: analysis

  - id: LO6.1.4
    text: "Assess if model assumptions are reasonably met using diagnostic plots."
    bloom: [analyse, evaluate]
    type: analysis

  - id: LO6.1.5
    text: "Assess if the group of explanatory variables significantly explain variation in the response."
    bloom: [analyse]
    type: analysis

  - id: LO6.1.6
    text: "Describe which variables are associated with the response, and the direction of these associations."
    bloom: [analyse]
    type: analysis

  - id: LO6.1.7
    text: "Measure the amount of variation explained by the model (R-squared, adjusted R-squared)."
    bloom: [apply]
    type: analysis

  - id: LO6.1.8
    text: "Assess the relative importance of different explanatory variables."
    bloom: [evaluate]
    type: analysis

  - id: LO6.1.9
    text: "Make conditional predictions from multiple regression models."
    bloom: [apply]
    type: analysis

  - id: LO6.1.10
