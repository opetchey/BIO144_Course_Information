    text: "Explain why normal error assumptions are inappropriate for count data."
    bloom: [understand]
    type: concept
    review_note: "Overlaps with previous objective."

  - id: LO8.1.4
    text: "Describe the key components of a generalised linear model (GLM): the linear predictor, the distribution family, and the link function."
    bloom: [understand]
    type: concept

  - id: LO8.1.5
    text: "Fit Poisson regression models using `glm()`."
    bloom: [apply]
    type: analysis

  - id: LO8.1.6
    text: "Interpret model coefficients on the appropriate scale."
    bloom: [analyse]
    type: analysis

  - id: LO8.1.7
    text: "Assess whether a Poisson model provides an adequate description of the data."
    bloom: [evaluate]
    type: analysis

  - id: LO8.1.8
    text: "Use R to fit, diagnose, and interpret GLMs for count data."
    bloom: [apply]
    type: analysis
