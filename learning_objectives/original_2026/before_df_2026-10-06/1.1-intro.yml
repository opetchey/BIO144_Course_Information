stem: "After this unit, students will be able to:"

objectives:
  - id: LO1.1.1
    text: "Describe how the lectures, course book, practicals, homework, weekly quizzes and final exam of BIO144 fit together."
    bloom: [understand]
    type: concept
    examinable: false

  - id: LO1.1.2
    text: "Identify the prior knowledge and skills assumed at the start of the course, and where to revise them."
    bloom: [remember]
    type: concept
    examinable: false

  - id: LO1.1.3
    text: "Describe the steps of a data analysis workflow, from formulating a question to communicating the answer, and explain why the presentation and analysis should be planned before the data are collected."
    bloom: [understand]
    type: concept

  - id: LO1.1.4
    text: "Describe the four principles for high-quality data analysis: a focused question with planned sampling and analysis; a model that accounts for the distribution and dependence of the data; emphasis on effect sizes and biological relevance; and reporting that makes the research reproducible."
    bloom: [understand]
    type: concept

  
  - id: LO1.1.5
    text: "Explain the advantages of doing a data analysis with a script in R, such as being repeatable, readable and sharable."
    bloom: [understand]
    type: concept

  - id: LO1.1.6
    text: "Distinguish appropriate from inappropriate uses of AI assistants in learning data analysis and in BIO144 assessments."
    bloom: [analyse]
    type: concept

  - id: LO1.1.7
    text: "Recognise and use the course notation for samples, populations and linear models (e.g. the sample mean, sample and population standard deviation, parameter estimates and residuals)."
    bloom: [remember, understand]
    type: concept
