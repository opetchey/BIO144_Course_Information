# Course-level learning objectives: single source of truth.
# Revised draft for 2027. Original 2026 wording: BIO144_Course_Information/3.1-learning-objectives.qmd
# `chapters` lists the chapters whose objectives build towards each course-level objective.

course: "BIO144"
title: "Data Analysis in Biology"
status: draft            # draft | reviewed | locked
version: "2027.0-draft"
last_updated: "2026-10-06"
stem: "After successfully completing BIO144, students will be able to:"

objectives:
  - id: CLO1
    text: "Translate a biological question into a statistical model by identifying the response variable, the explanatory variables and the structure of the data."
    bloom: [apply, analyse]
    chapters: ["1.1", "3.1", "6.1", "7.1", "11.1"]

  - id: CLO2
    text: "Use R and RStudio to import, explore, manipulate and visualise biological data in a reproducible script."
    bloom: [apply]
    chapters: ["2.1"]

  - id: CLO3
    text: "Choose an appropriate model (linear model, generalised linear model, mixed model or ordination) for a given question, type of response variable and study design, and justify the choice."
    bloom: [evaluate]
    chapters: ["3.1", "5.1", "6.1", "8.1", "9.1", "10.1", "11.1", "11.2"]

  - id: CLO4
    text: "Fit these models in R and obtain parameter estimates, their uncertainty, predictions and hypothesis tests."
    bloom: [apply]
    chapters: ["3.1", "4.1", "5.1", "6.1", "7.1", "8.1", "9.1", "10.1", "11.1"]

  - id: CLO5
    text: "Use diagnostics to evaluate whether model assumptions are reasonably met, and judge the consequences of violations for the conclusions."
    bloom: [analyse, evaluate]
    chapters: ["3.1", "5.1", "6.1", "8.1", "9.1"]

  - id: CLO6
    text: "Interpret model results quantitatively and in biological terms, focusing on effect sizes and their uncertainty rather than on p-values alone."
    bloom: [analyse]
    chapters: ["4.1", "5.1", "6.1", "7.1", "8.1", "9.1", "10.1", "11.1"]

  - id: CLO7
    text: "Evaluate whether an analysis supports a stated biological claim, recognising limitations such as correlation versus causation, extrapolation and pseudoreplication."
    bloom: [evaluate]
    chapters: ["4.1", "6.1", "10.1", "11.1", "11.2"]

  - id: CLO8
    text: "Recognise clear, correct and complete reporting of statistical results in text, tables and figures."
    bloom: [analyse]
    chapters: ["4.1", "5.1", "6.1", "7.1", "8.1", "9.1", "11.1"]
