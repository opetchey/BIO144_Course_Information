# Learning objectives: single source of truth.
# Used to generate the learning objectives in the course book chapter
# and on the course information website. Edit here only.
# Revised draft for 2027; original 2026 wording is in original_2026/.
# bloom and type tags are provisional; review_note flags items to check.

unit: 2
title: "R and RStudio"
book_chapter: "2.1-R-and-RStudio.qmd"
course_info_page: "Unit2.qmd"
status: draft            # draft | reviewed | locked
version: "2027.0-draft"
last_updated: "2026-10-06"
stem: "After this unit, students will be able to:"

objectives:
  - id: LO2.1.1
    text: "Explain the purpose of the script, the console and the environment in RStudio."
    bloom: [understand]
    type: concept

  - id: LO2.1.2
    text: "Write and run R code in a script, using objects, functions and arguments correctly."
    bloom: [apply]
    type: analysis

  - id: LO2.1.3
    text: "Install and load add-on packages, and explain the difference between installing and loading a package."
    bloom: [apply, understand]
    type: analysis

  - id: LO2.1.4
    text: "Use R's help system and other resources to find out how a function works and what arguments it takes."
    bloom: [apply]
    type: analysis

  - id: LO2.1.5
    text: "Import a dataset into R and inspect its structure, including the variable names and variable types."
    bloom: [apply]
    type: analysis

  - id: LO2.1.6
    text: "Convert variables to factors, and set or change the reference level of a categorical variable."
    bloom: [apply]
    type: analysis
    review_note: "Added in full review: covered in the main text of 2.1 (working with categorical variables) and 5.1 (relevel())."

  - id: LO2.1.7
    text: "Manipulate data in R: select variables, filter observations, create new variables, and calculate summaries by group."
    bloom: [apply]
    type: analysis
    review_note: "Check the list of manipulations and functions matches the chapter."

  - id: LO2.1.8
    text: "Produce exploratory graphs (e.g. histograms, scatterplots, box plots) to inspect distributions of and relationships between variables."
    bloom: [apply]
    type: analysis

  - id: LO2.1.9
    text: "Identify and fix common errors in R code (e.g. typos, misspelled variable names, packages not loaded)."
    bloom: [analyse]
    type: analysis
    review_note: "Partly covered: 2.1 discusses error messages (think-pair-share; package version errors) but has no section on finding and fixing common coding errors."

  - id: LO2.1.10
    text: "Organise an analysis as a script within an RStudio project, with meaningful names for datasets and model objects, that reproduces all results when run from top to bottom."
    bloom: [apply]
    type: analysis

